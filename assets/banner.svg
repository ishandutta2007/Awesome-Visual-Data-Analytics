<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 52px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    
    /* Animations for background graph & particles (behind text) */
    .pulse-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 6s ease-in-out infinite alternate;
    }
    .bar-anim-1 { animation: float 4s ease-in-out infinite alternate; }
    .bar-anim-2 { animation: float 5s ease-in-out 1s infinite alternate; }
    .bar-anim-3 { animation: float 4.5s ease-in-out 0.5s infinite alternate; }
    
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Dynamic Animated Graphic Elements (in background / side) -->
  <g transform="translate(720, 40)" stroke-opacity="0.6">
    <!-- Animated Chart Bars in background -->
    <rect class="bar-anim-1" x="40" y="140" width="36" height="120" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-anim-2" x="100" y="90" width="36" height="170" rx="6" fill="url(#barGrad2)" />
    <rect class="bar-anim-3" x="160" y="50" width="36" height="210" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-anim-1" x="220" y="110" width="36" height="150" rx="6" fill="url(#barGrad2)" />
    <rect class="bar-anim-2" x="280" y="70" width="36" height="190" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-anim-3" x="340" y="130" width="36" height="130" rx="6" fill="url(#barGrad2)" />

    <!-- Animated Data Line -->
    <path class="pulse-line" d="M 20 200 Q 80 150, 120 110 T 220 70 T 320 100 T 400 30" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Data points -->
    <circle cx="120" cy="110" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="220" cy="70" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="320" cy="100" r="6" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="400" cy="30" r="7" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Foreground Content: Title and Subtitle -->
  <g transform="translate(80, 0)">
    <text x="0" y="110" class="tagline">📊 CURATED ECOSYSTEM DIRECTORY</text>
    <text x="0" y="175" class="title" filter="url(#glow)">Awesome Visual Data Analytics</text>
    <text x="0" y="225" class="subtitle">The Definitive Guide to Commercial BI Platforms &amp; Open-Source Analytics</text>
    
    <!-- Badges / Tags in Hero Foreground -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="75" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">✨ SaaS &amp; OSS</text>

      <rect x="165" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="255" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">⚡ Real-Time BI</text>

      <rect x="360" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="445" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🤖 AI &amp; Copilot BI</text>
    </g>
  </g>
</svg>
